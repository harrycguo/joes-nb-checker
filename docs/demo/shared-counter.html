<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Counter — Artifact Viewer demo</title>
  <style>
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:#FCF9F3; color:#1D0760; display:grid; place-items:center; min-height:100vh; margin:0; }
    .card { background:#fff; border:1.5px solid #E8E5E0; border-radius:12px; padding:36px 44px; width:420px; text-align:center; }
    .count { font-size:64px; font-weight:800; margin:12px 0; }
    button { background:#3663FF; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:16px; font-weight:700; cursor:pointer; }
    button.reset { background:#fff; color:#1D0760; border:1.5px solid #E8E5E0; margin-left:8px; }
    textarea { width:100%; margin-top:18px; border:1.5px solid #E8E5E0; border-radius:8px; padding:10px; font:inherit; min-height:70px; }
    .hint { color:#8B8580; font-size:12px; margin-top:14px; }
  </style>
</head>
<body>
<!-- shared-storage shim: redirects localStorage to the viewer's shared store -->
<script>window.__ARTIFACT_ID__ = "demo-shared-counter";</script>
<script src="/shim/shared-storage.js"></script>

<div class="card">
  <h1>Shared counter</h1>
  <div class="count" id="count">0</div>
  <button id="inc">+1</button>
  <button class="reset" id="reset">reset</button>
  <textarea id="notes" placeholder="Shared notes… (type here in one tab, watch another)"></textarea>
  <div class="hint">Open this in two tabs — a change in one appears in the other within a few seconds. State lives in the viewer's Redis, keyed by this artifact's id.</div>
</div>

<script>
  function render() {
    document.getElementById('count').textContent = localStorage.getItem('count') || '0';
    var n = document.getElementById('notes');
    if (document.activeElement !== n) n.value = localStorage.getItem('notes') || '';
  }
  document.getElementById('inc').addEventListener('click', function () {
    localStorage.setItem('count', String((parseInt(localStorage.getItem('count') || '0', 10)) + 1));
    render();
  });
  document.getElementById('reset').addEventListener('click', function () {
    localStorage.setItem('count', '0'); render();
  });
  document.getElementById('notes').addEventListener('input', function (e) {
    localStorage.setItem('notes', e.target.value);
  });
  // Render once shared state has loaded, and again when a poll pulls in changes
  // (unless the user is mid-type in the notes field).
  SharedStorage.onReady(render);
  SharedStorage.onChange = function () {
    if (document.activeElement !== document.getElementById('notes')) render();
  };
</script>
</body>
</html>
