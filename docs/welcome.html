<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — Artifact Viewer demo</title>
  <style>
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:#FCF9F3; color:#1D0760; display:grid; place-items:center; min-height:100vh; margin:0; }
    .card { background:#fff; border:1.5px solid #E8E5E0; border-radius:12px; padding:36px 44px; max-width:520px; }
    h1 { margin:0 0 8px; }
    code { background:#FCF9F3; padding:1px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Static artifact</h1>
    <p>If you can read this through the viewer, it fetched this file live from
       <code>joes-nb-checker</code> via the GitHub App token. No shared state here —
       it's a plain static page.</p>
  </div>
</body>
</html>
